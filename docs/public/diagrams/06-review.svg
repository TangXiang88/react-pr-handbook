<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">评审与修改</title>
  <desc id="desc">按评论类型回应，并在推送后回复线程</desc>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="40" y="36" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1f2329">评审与修改</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1e1e1e">
    <rect x="40" y="70" width="140" height="56" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="110" y="104" text-anchor="middle">收到评论</text>
    <rect x="230" y="60" width="180" height="76" rx="10" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="2"/>
    <text x="320" y="92" text-anchor="middle">必须改</text>
    <text x="320" y="114" text-anchor="middle" font-size="12" fill="#495057">改代码 + 回复已处理</text>
    <rect x="440" y="60" width="180" height="76" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="530" y="92" text-anchor="middle">建议</text>
    <text x="530" y="114" text-anchor="middle" font-size="12" fill="#495057">采纳或说明不采纳</text>
    <rect x="650" y="60" width="180" height="76" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="740" y="92" text-anchor="middle">提问</text>
    <text x="740" y="114" text-anchor="middle" font-size="12" fill="#495057">先答再决定是否改</text>
  </g>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a6)">
    <defs>
      <marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#1e1e1e"/>
      </marker>
    </defs>
    <path d="M180 98 H230"/>
    <path d="M180 98 C200 98 210 70 230 70"/>
    <path d="M180 98 C200 98 210 130 230 130"/>
  </g>
  <rect x="40" y="180" width="400" height="72" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="240" y="212" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1e1e1e">推送修正</text>
  <text x="240" y="234" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#495057">新 commit 上线到 PR</text>
  <rect x="470" y="180" width="360" height="72" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="650" y="212" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1e1e1e">回复线程</text>
  <text x="650" y="234" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#495057">别让评审人翻 diff 猜状态</text>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a6b)">
    <defs>
      <marker id="a6b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#1e1e1e"/>
      </marker>
    </defs>
    <path d="M440 216 H470"/>
  </g>
  <text x="40" y="290" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#868e96">沉默 = 状态不明；回复是异步协作的基本礼貌</text>
</svg>
