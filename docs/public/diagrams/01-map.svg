<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">前端协作闭环（总览）</title>
  <desc id="desc">从接到任务到发布验证的八步协作路径</desc>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="40" y="36" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1f2329">前端协作闭环（总览）</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1e1e1e">
    <!-- row 1 boxes -->
    <rect x="40" y="70" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="95" y="104" text-anchor="middle">接到任务</text>
    <rect x="186" y="70" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="241" y="104" text-anchor="middle">拉分支</text>
    <rect x="332" y="70" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="387" y="104" text-anchor="middle">改代码</text>
    <rect x="478" y="70" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="533" y="104" text-anchor="middle">自测还原</text>
    <!-- row 2 boxes -->
    <rect x="40" y="200" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="95" y="234" text-anchor="middle">开 PR</text>
    <rect x="186" y="200" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="241" y="234" text-anchor="middle">评审修改</text>
    <rect x="332" y="200" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="387" y="234" text-anchor="middle">合并</text>
    <rect x="478" y="200" width="110" height="56" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="533" y="234" text-anchor="middle">发布验证</text>
  </g>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#1e1e1e"/>
      </marker>
    </defs>
    <path d="M150 98 H186"/>
    <path d="M296 98 H332"/>
    <path d="M442 98 H478"/>
    <path d="M533 126 V160 H95 V200"/>
    <path d="M150 228 H186"/>
    <path d="M296 228 H332"/>
    <path d="M442 228 H478"/>
  </g>
  <text x="40" y="310" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#868e96">每章展开一个节点；examples/app 用于「改代码」之后的练习</text>
</svg>
